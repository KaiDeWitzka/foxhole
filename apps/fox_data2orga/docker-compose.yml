# Runtipi dynamic compose (schema_version 2) für fox_data2orga.
# Runtipi mappt ${APP_PORT} automatisch auf internal_port – kein eigenes ports:-Mapping nötig.
# Formularfelder aus config.json stehen als ${ENV_VARIABLE} bereit.
services:
  fox_data2orga:
    image: ghcr.io/kaidewitzka/fox_data2orga:main
    container_name: fox_data2orga
    init: true
    # Härtung wie im Projekt-Image: non-root (uid 10001), read-only Root-FS, keine Caps, no-new-privileges
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - DATA2ORGA_HOST=0.0.0.0
      - DATA2ORGA_PORT=8000
      - DATA2ORGA_DATA_DIR=/data
      # Basic-Auth (bei Expose Pflicht, siehe config.json-Hinweis); leer = deaktiviert
      - DATA2ORGA_USER=${DATA2ORGA_USER:-}
      - DATA2ORGA_PASSWORD=${DATA2ORGA_PASSWORD:-}
      # LDAP/AD-Import (optional, TLS erzwungen; Passwort nur in app.env des Hosts)
      - DATA2ORGA_LDAP_URI=${DATA2ORGA_LDAP_URI:-}
      - DATA2ORGA_LDAP_BASE_DN=${DATA2ORGA_LDAP_BASE_DN:-}
      - DATA2ORGA_LDAP_BIND_DN=${DATA2ORGA_LDAP_BIND_DN:-}
      - DATA2ORGA_LDAP_BIND_PASSWORD=${DATA2ORGA_LDAP_BIND_PASSWORD:-}
      - DATA2ORGA_LDAP_PRESET=${DATA2ORGA_LDAP_PRESET:-auto}
      - DATA2ORGA_LDAP_STARTTLS=${DATA2ORGA_LDAP_STARTTLS:-}
      - DATA2ORGA_RETENTION_DAYS=${DATA2ORGA_RETENTION_DAYS:-90}
      - DATA2ORGA_RATE_LIMIT=${DATA2ORGA_RATE_LIMIT:-120}
      - DATA2ORGA_MAX_UPLOAD_MB=${DATA2ORGA_MAX_UPLOAD_MB:-10}
    volumes:
      # persistente Uploads/Artefakte/SQLite im Runtipi-App-Data-Verzeichnis
      - ${APP_DATA_DIR}/data:/data
    command: ["web", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 8000

x-runtipi:
  schema_version: 2
