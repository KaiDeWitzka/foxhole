# fox_netmap als RunTipi-App (Test-Repo fox_tmp).
# Zwei Dienste aus dem selben Image (ghcr.io/kaidewitzka/fox_netmap, per Tag+Digest gepinnt):
#   - netmap          Web-UI, Runtipi mappt den App-Port (config.json "port") auf internal_port 8399
#   - netmap-scanner  zyklischer Scanner, braucht host-Netzwerk + NET_RAW (ping), um das LAN zu sehen
# Haertung wie upstream (fox_netmap >= v1.5.0): read_only, tmpfs /tmp, Web ohne Capabilities und mit
# no-new-privileges; der Entrypoint im Image startet beide als UID 10001 undraeumt alle Capabilities
# bis auf NET_RAW (Scanner) ab. Zum Testen eines noch nicht releasten Branches das Image auf
# ghcr.io/kaidewitzka/fox_netmap:main bzw. :sha-<sha> umstellen (nach dem Push des Branches).
# Hinweis: solange das GitHub-Repo privat ist, braucht der Pull aus ghcr.io ein Token (read:packages).
x-netz-env: &netz-env
  NETZ_DATA_DIR: /data
  NETZ_HOST: 0.0.0.0
  NETZ_PORT: "8399" # intern fix; Runtipi mappt den Host-Port darauf (x-runtipi.internal_port)
  NETZ_SUBNETS: ${NETZ_SUBNETS:-}
  NETZ_SITES: ${NETZ_SITES:-}
  NETZ_SCAN_INTERVAL: ${NETZ_SCAN_INTERVAL:-900}
  NETZ_SCAN_TIMEOUT: ${NETZ_SCAN_TIMEOUT:-1}
  NETZ_PORT_TOP: ${NETZ_PORT_TOP:-1000}
  NETZ_PORTS: ${NETZ_PORTS:-}
  NETZ_FRITZ_URL: ${NETZ_FRITZ_URL:-}
  NETZ_FRITZ_URLS: ${NETZ_FRITZ_URLS:-}
  NETZ_FRITZ_USER: ${NETZ_FRITZ_USER:-}
  NETZ_FRITZ_PASS: ${NETZ_FRITZ_PASS:-}
  NETZ_FRITZ_MESH: ${NETZ_FRITZ_MESH:-true}
  NETZ_TR064_INSECURE_TLS: ${NETZ_TR064_INSECURE_TLS:-false}
  NETZ_VPN_POOL: ${NETZ_VPN_POOL:-off}
  NETZ_SNMP_ENABLED: ${NETZ_SNMP_ENABLED:-false}
  NETZ_SNMP_COMMUNITY: ${NETZ_SNMP_COMMUNITY:-} # seit v1.6.0 KEIN Default mehr; leer = kein SNMP
  NETZ_SNMP_SWITCHES: ${NETZ_SNMP_SWITCHES:-}
  # Container-Scan ueber Docker Engine API (read-only, default AUS - API ist root-aequivalent am Host)
  NETZ_DOCKER_ENABLED: ${NETZ_DOCKER_ENABLED:-false}
  NETZ_DOCKER_HOSTS: ${NETZ_DOCKER_HOSTS:-}
  NETZ_DOCKER_INSECURE_TLS: ${NETZ_DOCKER_INSECURE_TLS:-false}
  NETZ_DOCKER_TOKEN: ${NETZ_DOCKER_TOKEN:-}
  # Proxmox VE API fuer VM/CT-Scan + SDN-Subnetze (read-only, Token-Auth, default AUS - API-Token kann admin-aequivalent sein)
  NETZ_PVE_ENABLED: ${NETZ_PVE_ENABLED:-false}
  NETZ_PVE_URLS: ${NETZ_PVE_URLS:-}
  NETZ_PVE_USER: ${NETZ_PVE_USER:-}
  NETZ_PVE_TOKEN_ID: ${NETZ_PVE_TOKEN_ID:-}
  NETZ_PVE_TOKEN_SECRET: ${NETZ_PVE_TOKEN_SECRET:-}
  NETZ_PVE_INSECURE_TLS: ${NETZ_PVE_INSECURE_TLS:-false}
  NETZ_AUTH_ENABLED: ${NETZ_AUTH_ENABLED:-true}
  NETZ_AUTH_USER: ${NETZ_AUTH_USER:-admin}
  NETZ_AUTH_PASS: ${NETZ_AUTH_PASS:-}
  NETZ_NOTIFY_WEBHOOK: ${NETZ_NOTIFY_WEBHOOK:-}
  NETZ_NOTIFY_GOTIFY: ${NETZ_NOTIFY_GOTIFY:-}
  NETZ_NOTIFY_GOTIFY_TOKEN: ${NETZ_NOTIFY_GOTIFY_TOKEN:-}
  NETZ_NOTIFY_NTFY: ${NETZ_NOTIFY_NTFY:-}
  NETZ_NOTIFY_NTFY_TOKEN: ${NETZ_NOTIFY_NTFY_TOKEN:-}
  NETZ_ALARM_WHITELIST: ${NETZ_ALARM_WHITELIST:-}
  NETZ_HISTORY_HOURS: ${NETZ_HISTORY_HOURS:-720}
  NETZ_DEVICE_RETENTION_DAYS: ${NETZ_DEVICE_RETENTION_DAYS:-30}
  NETZ_EVENT_RETENTION_DAYS: ${NETZ_EVENT_RETENTION_DAYS:-90}
  NETZ_AUTO_EXPORT: ${NETZ_AUTO_EXPORT:-false}
  NETZ_AUTO_EXPORT_DIR: ${NETZ_AUTO_EXPORT_DIR:-exports}
  NETZ_AUTO_EXPORT_INTERVAL_HOURS: ${NETZ_AUTO_EXPORT_INTERVAL_HOURS:-24}
  NETZ_MDNS_ENABLED: ${NETZ_MDNS_ENABLED:-true}
  NETZ_OUI_ONLINE_ENABLED: ${NETZ_OUI_ONLINE_ENABLED:-false} # Datenschutz: Default aus
  NETZ_OUI_ONLINE_MAX: ${NETZ_OUI_ONLINE_MAX:-10}
  NETZ_OUI_ONLINE_URL: ${NETZ_OUI_ONLINE_URL:-https://api.macvendors.com}
  NETZ_THEME: ${NETZ_THEME:-dark}
  NETZ_LANG: ${NETZ_LANG:-de}
  NETZ_EMBED_ANCESTORS: ${NETZ_EMBED_ANCESTORS:-*}
  NETZ_COOKIE_SECURE: ${NETZ_COOKIE_SECURE:-auto}
  # env-only (kein Schema-Eintrag): wird in app/db.py bzw. app/__main__.py per os.getenv gelesen
  NETZ_SQLITE_JOURNAL: ${NETZ_SQLITE_JOURNAL:-auto}
  TZ: ${TZ:-Europe/Berlin}

services:
  netmap:
    image: ghcr.io/kaidewitzka/fox_netmap:1.9.1@sha256:61c2923135c5b32721d9c3d94bfcb6a727b35f4395cb1fcbfe2351b3a250a8da
    init: true # SIGTERM sauber an den Prozess weiterreichen
    restart: unless-stopped
    environment: *netz-env
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m # Deckel fuer PDF-Export und Bilder
    security_opt:
      - no-new-privileges:true
    x-runtipi:
      is_main: true
      internal_port: 8399

  netmap-scanner:
    image: ghcr.io/kaidewitzka/fox_netmap:1.9.1@sha256:61c2923135c5b32721d9c3d94bfcb6a727b35f4395cb1fcbfe2351b3a250a8da
    init: true
    restart: unless-stopped
    command: ["scanner"]
    # Host-Netzwerk, damit ARP/NDP/TR-064/SNMP das echte LAN erreichen
    network_mode: host
    # NET_RAW fuer ping (ICMP) — im Image per setcap als Datei-Capability auf /bin/ping.
    # Absichtlich KEIN no-new-privileges hier: das wuerde die Datei-Capability wirkungslos machen.
    cap_add:
      - NET_RAW
    environment: *netz-env
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp

x-runtipi:
  schema_version: 2
