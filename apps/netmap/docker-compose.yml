services:
  netzwerkkarte:
    image: python:3.12-alpine
    container_name: netmap
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data:ro
      # Skripte direkt aus dem App-Ordner (./app) - NICHT aus data/app kopieren:
      # so greift ein App-Update sofort (in-place), ohne Neuinstallation.
      - ./app:/opt/netzwerkkarte:ro
      - ${APP_DATA_DIR}/data/config:/config:rw
    # WICHTIG: Auf internal_port (8080) muss der Container plain HTTP sprechen -
    # Runtipi/Traefik routet HTTP dorthin; TLS im Container => 502 Bad Gateway.
    # HTTPS am Edge terminieren (Runtipi "Local SSL certificates" / App mit TLS exponieren / NPM).
    # Sofort starten (kein Warten auf die erste Scan-Datei => kein 502 in der Startphase).
    command:
      - /bin/sh
      - -c
      - if [ -f /opt/netzwerkkarte/serve_https.py ]; then exec python3 /opt/netzwerkkarte/serve_https.py; else exec python3 -m http.server 8080 --directory /data/web; fi
    x-runtipi:
      is_main: true
      internal_port: 8080
  netzwerkkarte-scanner:
    image: python:3.12-alpine
    container_name: netmap-scanner
    restart: unless-stopped
    # Host-Netzwerk, damit ARP/MAC-Adressen des LAN aufgeloest werden koennen
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: ${TZ}
      NETZ_SUBNET: ${NETZ_SUBNET:-}
      NETZ_SCAN_INTERVAL: ${NETZ_SCAN_INTERVAL:-900}
      NETZ_FRITZ_URL: ${NETZ_FRITZ_URL:-}
      NETZ_FRITZ_USER: ${NETZ_FRITZ_USER:-}
      NETZ_FRITZ_PASS: ${NETZ_FRITZ_PASS:-}
      NETZ_SNMP_COMMUNITY: ${NETZ_SNMP_COMMUNITY:-}
    volumes:
      # Skripte direkt aus dem App-Ordner (./app) - bei App-Update sofort aktiv (in-place).
      # Laufzeitdaten (scan.json, web/, certs/, config/) liegen persistent in ${APP_DATA_DIR}/data.
      - ./app:/opt/netzwerkkarte:ro
      - ${APP_DATA_DIR}/data:/data
    entrypoint:
      - /bin/sh
      - /opt/netzwerkkarte/entrypoint.sh
x-runtipi:
  schema_version: 2
